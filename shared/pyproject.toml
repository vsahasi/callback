[project]
name = "callback-shared"
version = "1.2.0"
requires-python = ">=3.11"
# 2.11 is the oldest pydantic that renders the contract's JSON schema the way the snapshot test
# expects. 2.9 and 2.10 differ in two places, so do not lower this floor.
dependencies = ["pydantic>=2.11,<3"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callback_shared"]

# Lint with the repo's root ruff.toml, plus two exceptions for this package only.
# The contract keeps runtime annotations (no `from __future__ import annotations`),
# and its tests use compound asserts.
[tool.ruff]
extend = "../ruff.toml"

[tool.ruff.lint.per-file-ignores]
"src/callback_shared/*.py" = ["I002"]
"tests/*.py" = ["I002", "PT018"]
