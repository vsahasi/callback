[project]
name = "callback-detector"
version = "0.1.0"
description = "Callback: caller authenticity detection service (detector, training, shared contract)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Upper bound on purpose: ruff minor releases add rules, which would turn
    # a dependency bump into a surprise CI failure.
    "ruff>=0.17.3,<0.18",
]
deploy = [
    "modal>=1.0",
]
train = [
    "torch>=2.15",
    "soundfile>=0.12",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "detector", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
