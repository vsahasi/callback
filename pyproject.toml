[project]
name = "callback-detector"
version = "0.1.0"
description = "Callback: caller authenticity detection service (detector, training, shared contract)"
requires-python = ">=3.11,<3.12"
dependencies = [
    # The agent-to-detector wire contract (shared/src/callback_shared), served
    # under /v1. Installed from the in-repo path below, editable.
    "callback-shared",
    "fastapi>=0.115",
    "httpx>=0.27",
    # detector/analysis is pure numpy on purpose: no scipy, no librosa, no
    # torch on the serving path. It is a runtime dependency of the detector,
    # not just of training.
    "numpy>=1.26",
    # Only the flac branch of detector/audio needs this, but the contract
    # declares flac, so a deployment without it would refuse a format it
    # advertises. The wheel bundles libsndfile, so there is no system package
    # to install alongside it.
    "soundfile>=0.12",
    "pydantic>=2.11,<3",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Upper bound on purpose: ruff minor releases add rules, which would turn
    # a dependency bump into a surprise CI failure.
    "ruff>=0.17.3,<0.18",
]
deploy = [
    "modal>=1.0",
]
train = [
    "torch>=2.15",
]

[tool.uv.sources]
callback-shared = { path = "shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "detector", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
